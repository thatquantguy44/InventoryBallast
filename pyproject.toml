[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inventory-optimizer"
version = "0.1.0"
description = "Portable, solver-neutral securities-lending inventory optimization engine (Spec002)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Joshua Lutkemuller" }
]
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyyaml>=6.0",
]

[project.scripts]
inventory-optimizer = "inventory_optimizer.cli:main"

[project.optional-dependencies]
highs = [
  "highspy>=1.7",
]
dataframe = [
  "pandas>=2.2",
]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
# QuantSmith has no tagged releases yet; pinned to the exact origin/main commit
# for reproducibility (see requirements.txt). Re-pin to a tag once one exists.
agentic = [
  "quantsmith @ git+https://github.com/joshualutkemuller/QuantSmith@3951654f56c995465b4c090f39eeb34f8c9671ff",
]

[tool.hatch.metadata]
# Required because the `agentic` extra pins quantsmith to a Git commit
# (no tagged release exists yet) rather than a PyPI version.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["inventory_optimizer"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# highspy ships a stub with gaps: some constructors read as untyped without follow_imports="skip",
# and one enum member (HighsModelStatus.kHighsInterrupt, real at runtime) is missing from it even
# with skip -- silenced at its one use site in solvers/highs.py instead of here.
module = ["highspy", "highspy.*"]
ignore_missing_imports = true
follow_imports = "skip"
